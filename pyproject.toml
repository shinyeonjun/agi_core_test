[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.16.0a0"
description = "Local Stateful Digital AGI-oriented Agent Core for Orange Pi"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4,<3",
]

[project.scripts]
agentctl = "agent.cli.agentctl:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.memory" = ["schema.sql"]
"agent.eval" = ["tasks/*.json"]
