[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.2.0a0"
description = "Local Stateful Agent Core for Orange Pi"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentctl = "agent.cli.agentctl:main"

[tool.setuptools]
packages = [
  "agent",
  "agent.cli",
  "agent.config",
  "agent.core",
  "agent.memory",
  "agent.renderer",
  "agent.scheduler",
]
include-package-data = true

[tool.setuptools.package-data]
"agent.memory" = ["schema.sql"]
