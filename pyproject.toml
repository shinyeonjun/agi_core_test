[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurokernel-seed"
version = "0.1.0"
description = "Non-model AGI seed harness with microworlds, evaluator, logger, replay exporter, and v0 world-model tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
model = ["numpy>=1.26", "torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]
discord = ["discord.py>=2.4"]
queue = ["redis>=5.0"]

[project.scripts]
neuroseed = "neurokernel_seed.cli:main"
nk = "neurokernel_seed.nk_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
