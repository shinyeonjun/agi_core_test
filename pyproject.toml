[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.19.0a0"
description = "Local Stateful Digital AGI-oriented Agent Core for Orange Pi"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4,<3",
]

[project.scripts]
agentctl = "agent.cli.agentctl:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.memory" = ["schema.sql"]
"agent.eval" = ["tasks/*.json"]


[tool.pytest.ini_options]
markers = [
  "smoke: very small checks for basic Core liveness",
  "fast: default development checks that should finish quickly on Orange Pi",
  "integration: broader cross-component checks",
  "slow: expensive checks reserved for full/release validation",
  "chat: chat and Discord bridge checks",
  "discord: Discord control plane checks",
  "worker: Codex worker and task-loop checks",
]
